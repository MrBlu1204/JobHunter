logging.level.com.jobhunter.api=DEBUG

# MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3307/jobhunter_db
spring.datasource.username=jobhunter_app
spring.datasource.password=${MYSQL_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true